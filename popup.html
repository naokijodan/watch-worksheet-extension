<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Watch Worksheet</title>
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }
    h2 {
      font-size: 14px;
      margin: 0 0 12px 0;
      color: #333;
      text-align: center;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      box-sizing: border-box;
    }
    .btn-primary {
      background: #2196F3;
      color: white;
    }
    .btn-primary:hover {
      background: #1976D2;
    }
    .btn-secondary {
      background: #757575;
      color: white;
    }
    .btn-secondary:hover {
      background: #616161;
    }
  </style>
</head>
<body>
  <h2>Watch Worksheet Generator</h2>
  <button class="btn btn-primary" id="openMainBtn">ワークシート作成</button>
  <button class="btn btn-secondary" id="openSettingsBtn">設定</button>
  <script src="popup.js"></script>
</body>
</html>
